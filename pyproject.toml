[project]
name = "CM4Xutils"
dynamic = ["version"]
authors = [
    {name="Henri F. Drake", email="hfdrake@uci.edu"},
]
description = "A package for loading and manipulating CM4X output"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "netcdf4",
    "bottleneck",
    "xgcm >= 0.10.0",
    "cftime",
    "nc-time-axis",
    "gsw >= 3.4.0",
    # xeos supplies the equation of state used to compute sigma2 offline. We use its
    # MOM6 Wright (1997) reduced-range EOS to match the CM4X model configuration
    # (EQN_OF_STATE="WRIGHT") instead of gsw/TEOS-10. See CM4Xutils/loading.py:CM4X_EOS.
    "xeos[teos10] >= 0.1.0",
    "xbudget >= 0.7.0",
    # Pinned to the commit that adds the configurable `eos=` parameter (xeos-backed) and
    # the xbudget 0.7.0-compatible API.
    "xwmt @ git+https://github.com/NOAA-GFDL/xwmt.git@30566eed785df90b78b1cf325da2204ec90f66f3",
    # Only used by the example water-mass-budget notebooks (not by the CM4Xutils library
    # itself). NOTE: xwmb 0.6.0 is not yet compatible with xbudget>=0.7.0 (it calls the
    # removed top-level xbudget.aggregate), so the WMB notebooks will not run until xwmb is
    # updated upstream. Re-pin to that release/commit once available.
    "xwmb @ git+https://github.com/hdrake/xwmb.git@main",
    "doralite @ git+https://github.com/hdrake/doralite.git@master",
    "intake-esm",
    "gfdl_utils @ git+https://github.com/hdrake/gfdl_utils.git@master",
]

[project.urls]
"Homepage" = "https://github.com/hdrake/CM4Xutils"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "CM4Xutils/version.py"
